version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: knowledge-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data_loader:
    build:
      context: ./data_loader
      dockerfile: Dockerfile
    container_name: knowledge-loader
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    networks:
      - knowledge-net
    volumes:
      - ./data_loader:/app

  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: knowledge-chatbot
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-api-key-here}
    networks:
      - knowledge-net
    volumes:
      - ./chatbot:/app
    command: python app.py

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  knowledge-net:
    driver: bridge
